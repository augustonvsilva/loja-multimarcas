name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Paginas HTML atualizadas
        run: |
          npm run build
          git diff --exit-code -- '*.html' sitemap.xml || (echo "Rode 'npm run build' e faca commit das paginas geradas." && exit 1)
