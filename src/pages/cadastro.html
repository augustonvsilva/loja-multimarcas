<!--page {"title": "Criar conta", "page": "cadastro", "noindex": true, "scripts": ["auth.js"]} -->
<section class="form-card glass-panel reveal">
  <span class="eyebrow">Cadastro</span>
  <h1 class="page-title">Crie sua conta</h1>
  <p class="page-subtitle">Acompanhe seus pedidos e finalize compras com mais rapidez.</p>

  <form id="register-form" class="form-grid">
    <div class="field-full">
      <label for="register-name">Nome completo</label>
      <input class="input" id="register-name" name="name" type="text" autocomplete="name" required minlength="3">
    </div>
    <div class="field-full">
      <label for="register-email">Email</label>
      <input class="input" id="register-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="register-password">Senha (mínimo 8 caracteres)</label>
      <input class="input" id="register-password" name="password" type="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="field">
      <label for="register-confirm-password">Confirmar senha</label>
      <input class="input" id="register-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="field-full">
      <label class="checkbox-line"><input type="checkbox" name="acceptTerms" required> Li e aceito a <a href="./privacidade.html" target="_blank">política de privacidade</a>.</label>
    </div>
    <div class="field-full">
      <button class="btn" type="submit">Criar conta</button>
    </div>
  </form>

  <div id="register-feedback" class="feedback" role="alert"></div>
  <p class="auth-note">Já possui conta? <a href="./login.html">Fazer login</a>.</p>
</section>
