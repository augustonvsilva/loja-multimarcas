<section class="page-hero">
  <div class="container">
    <div class="page-banner glass-panel reveal">
      <span class="eyebrow">Catálogo</span>
      <h1 class="page-title">Todos os produtos</h1>
      <div class="catalog-filter-stack">
        <div>
          <span class="eyebrow">Marcas</span>
          <div id="brand-filters" class="filters"></div>
        </div>
        <div>
          <span class="eyebrow">Categorias</span>
          <div id="category-filters" class="filters"></div>
        </div>
        <div class="catalog-tools">
          <div class="field">
            <label for="catalog-search">Buscar</label>
            <input class="input" id="catalog-search" type="search" placeholder="Ex: jaqueta, tênis, polo">
          </div>
          <div class="field">
            <label for="catalog-sort">Ordenar por</label>
            <select class="select" id="catalog-sort">
              <option value="featured">Destaques</option>
              <option value="price-asc">Menor preço</option>
              <option value="price-desc">Maior preço</option>
              <option value="name-asc">Nome A-Z</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <p id="catalog-count" class="muted-text" aria-live="polite"></p>
    <div class="product-grid" data-product-grid="all"></div>
  </div>
</section>
