<!--page {"title": "Gestão de produtos", "adminView": "products", "scripts": ["admin.js"]} -->
<section class="page-hero">
  <div class="container">
    <div class="page-banner glass-panel reveal">
      <span class="eyebrow">Admin</span>
      <h1 class="page-title">Gestão de produtos</h1>
      <div class="admin-tabs">
        <a class="admin-tab" href="./pedidos.html" data-admin-link="orders">Pedidos</a>
        <a class="admin-tab" href="./produtos.html" data-admin-link="products">Produtos</a>
        <a class="admin-tab" href="./faturamento.html" data-admin-link="billing">Faturamento</a>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div id="admin-gate" class="feedback error" hidden>Área restrita. <a href="../login.html?next=admin/produtos.html">Entre com a conta de administrador</a>.</div>
    <div id="admin-panel" class="admin-layout" hidden>
      <div class="admin-main-column">
        <div class="admin-card">
          <div class="table-row admin-toolbar">
            <h2>Produtos cadastrados</h2>
            <input id="admin-search" class="input" type="search" placeholder="Buscar produto" aria-label="Buscar produto">
          </div>
          <div id="admin-products"></div>
        </div>
      </div>

      <div class="admin-side-column">
        <form id="admin-form" class="admin-card">
          <input type="hidden" name="productId">
          <h2 id="admin-form-title">Cadastrar produto</h2>
          <div class="form-grid">
            <div class="field-full">
              <label for="name">Nome do produto</label>
              <input class="input" id="name" name="name" type="text" placeholder="Ex: Jaqueta Corta-vento Preta" required maxlength="120">
            </div>
            <div class="field">
              <label for="brand">Marca</label>
              <select class="select" id="brand" name="brand" required></select>
            </div>
            <div class="field">
              <label for="new-brand-name">Nova marca</label>
              <div class="inline-field">
                <input class="input" id="new-brand-name" type="text" placeholder="Ex: Reserva">
                <button class="btn-secondary" type="button" data-add-brand>+</button>
              </div>
            </div>
            <div class="field">
              <label for="category">Categoria</label>
              <select class="select" id="category" name="category" required></select>
            </div>
            <div class="field">
              <label for="new-category-name">Nova categoria</label>
              <div class="inline-field">
                <input class="input" id="new-category-name" type="text" placeholder="Ex: Bermudas">
                <button class="btn-secondary" type="button" data-add-category>+</button>
              </div>
            </div>
            <div class="field">
              <label for="price">Preço de venda (R$)</label>
              <input class="input" id="price" name="price" type="number" min="0.01" step="0.01" required>
            </div>
            <div class="field">
              <label for="cost">Custo (R$, interno)</label>
              <input class="input" id="cost" name="cost" type="number" min="0" step="0.01">
            </div>
            <div class="field">
              <label for="stock">Estoque (unidades)</label>
              <input class="input" id="stock" name="stock" type="number" min="0" step="1" required>
            </div>
            <div class="field">
              <label>Lucro por peça</label>
              <strong id="admin-profit-preview" class="finance-kpi">R$ 0,00</strong>
            </div>
            <div class="field-full">
              <label for="images">Fotos (JPG, PNG ou WEBP, até 8)</label>
              <input class="input" id="images" name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
              <div id="admin-image-preview" class="admin-image-preview"></div>
            </div>
            <div class="field-full">
              <label for="description">Descrição</label>
              <textarea class="input textarea" id="description" name="description" placeholder="Tecido, caimento, detalhes e diferenciais." maxlength="2000"></textarea>
            </div>
            <div class="field-full">
              <label>Grade</label>
              <div class="option-toggle-grid">
                <label class="tag option-toggle"><input type="checkbox" name="hasSizes"> Tamanhos (PP a XGG)</label>
                <label class="tag option-toggle"><input type="checkbox" name="hasNumbers"> Numeração (calçados)</label>
              </div>
            </div>
            <div id="sizes-group" class="field-full admin-choice-group" hidden>
              <label>Tamanhos disponíveis</label>
              <div class="option-checklist">
                <label class="tag"><input type="checkbox" name="sizeOptions" value="PP"> PP</label>
                <label class="tag"><input type="checkbox" name="sizeOptions" value="P"> P</label>
                <label class="tag"><input type="checkbox" name="sizeOptions" value="M"> M</label>
                <label class="tag"><input type="checkbox" name="sizeOptions" value="G"> G</label>
                <label class="tag"><input type="checkbox" name="sizeOptions" value="GG"> GG</label>
                <label class="tag"><input type="checkbox" name="sizeOptions" value="XG"> XG</label>
                <label class="tag"><input type="checkbox" name="sizeOptions" value="XGG"> XGG</label>
              </div>
            </div>
            <div id="numbers-group" class="field-full admin-choice-group" hidden>
              <label>Numerações disponíveis</label>
              <div class="option-checklist">
                <label class="tag"><input type="checkbox" name="numberOptions" value="33"> 33</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="34"> 34</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="35"> 35</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="36"> 36</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="37"> 37</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="38"> 38</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="39"> 39</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="40"> 40</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="41"> 41</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="42"> 42</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="43"> 43</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="44"> 44</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="45"> 45</label>
                <label class="tag"><input type="checkbox" name="numberOptions" value="46"> 46</label>
              </div>
            </div>
            <div class="field-full option-toggle-grid">
              <label class="tag"><input type="checkbox" name="active" checked> Visível na loja</label>
              <label class="tag"><input type="checkbox" name="featured"> Destaque na home</label>
            </div>
            <div class="field-full button-row">
              <button class="btn" type="submit">Salvar produto</button>
              <button class="btn-ghost" type="button" id="admin-form-reset">Limpar</button>
            </div>
          </div>
          <div id="admin-feedback" class="feedback" role="status"></div>
        </form>
      </div>
    </div>
  </div>
</section>
