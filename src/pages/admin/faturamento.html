<section class="page-hero">
  <div class="container">
    <div class="page-banner glass-panel reveal">
      <span class="eyebrow">Admin</span>
      <h1 class="page-title">Faturamento</h1>
      <div class="admin-tabs">
        <a class="admin-tab" href="./pedidos.html" data-admin-link="orders">Pedidos</a>
        <a class="admin-tab" href="./produtos.html" data-admin-link="products">Produtos</a>
        <a class="admin-tab" href="./faturamento.html" data-admin-link="billing">Faturamento</a>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div id="admin-gate" class="feedback error" hidden>Área restrita. <a href="../login.html?next=admin/faturamento.html">Entre com a conta de administrador</a>.</div>
    <div id="admin-panel" class="admin-main-column" hidden>
      <section class="admin-card">
        <div class="table-row admin-toolbar">
          <h2>Resumo</h2>
          <select id="billing-filter" class="select billing-filter" aria-label="Período">
            <option value="month">Este mês</option>
            <option value="7d">Últimos 7 dias</option>
            <option value="30d">Últimos 30 dias</option>
            <option value="all">Todo o período</option>
          </select>
        </div>
        <div id="billing-summary" class="summary-grid"></div>
      </section>

      <div class="admin-finance-grid">
        <div class="info-card">
          <h3>Vendas pagas</h3>
          <div id="billing-orders"></div>
        </div>

        <div class="info-card">
          <h3>Despesas</h3>
          <form id="expense-form" class="form-grid">
            <div class="field-full">
              <label for="expense-description">Descrição</label>
              <input class="input" id="expense-description" name="description" type="text" placeholder="Ex: embalagens, anúncios, frete" required>
            </div>
            <div class="field">
              <label for="expense-category">Categoria</label>
              <input class="input" id="expense-category" name="category" type="text" placeholder="Marketing" required list="expense-categories">
              <datalist id="expense-categories"><option value="Marketing"><option value="Operacional"><option value="Fornecedores"><option value="Frete"><option value="Impostos"></datalist>
            </div>
            <div class="field">
              <label for="expense-amount">Valor (R$)</label>
              <input class="input" id="expense-amount" name="amount" type="number" min="0.01" step="0.01" required>
            </div>
            <div class="field-full">
              <button class="btn" type="submit">Lançar despesa</button>
            </div>
          </form>
          <div id="expense-feedback" class="feedback" role="status"></div>
          <div id="expense-list" class="admin-list"></div>
        </div>
      </div>
    </div>
  </div>
</section>
