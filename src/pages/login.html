<!--page {"title": "Entrar", "page": "login", "noindex": true, "scripts": ["auth.js"]} -->
<section class="form-card glass-panel reveal">
  <span class="eyebrow">Login</span>
  <h1 class="page-title">Acesse sua conta</h1>
  <p class="page-subtitle">Acompanhe seus pedidos e compre mais rápido.</p>

  <form id="login-form" class="form-grid">
    <div class="field-full">
      <label for="login-email">Email</label>
      <input class="input" id="login-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field-full">
      <label for="login-password">Senha</label>
      <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="field-full">
      <button class="btn" type="submit">Entrar</button>
    </div>
  </form>

  <div id="login-feedback" class="feedback" role="alert"></div>
  <p class="auth-note"><a href="./recuperar-senha.html">Esqueceu a senha?</a></p>
  <p class="auth-note">Ainda não tem conta? <a href="./cadastro.html">Criar cadastro</a>. Você também pode comprar sem cadastro.</p>
</section>
