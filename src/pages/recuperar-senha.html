<section class="form-card glass-panel reveal">
  <span class="eyebrow">Recuperar acesso</span>
  <h1 class="page-title">Esqueceu sua senha?</h1>

  <form id="password-recovery-form" class="form-grid">
    <p class="page-subtitle field-full">Informe o email da sua conta e enviaremos um link para criar uma nova senha.</p>
    <div class="field-full">
      <label for="recovery-email">Email</label>
      <input class="input" id="recovery-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field-full">
      <button class="btn" type="submit">Enviar link</button>
    </div>
  </form>

  <form id="password-reset-form" class="form-grid" hidden>
    <p class="page-subtitle field-full">Escolha sua nova senha.</p>
    <div class="field">
      <label for="reset-password">Nova senha</label>
      <input class="input" id="reset-password" name="password" type="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="field">
      <label for="reset-confirm">Confirmar senha</label>
      <input class="input" id="reset-confirm" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="field-full">
      <button class="btn" type="submit">Salvar nova senha</button>
    </div>
  </form>

  <div id="recovery-feedback" class="feedback" role="alert"></div>
  <p class="auth-note"><a href="./login.html">Voltar para o login</a></p>
</section>
